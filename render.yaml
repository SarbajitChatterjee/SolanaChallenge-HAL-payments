# Render Blueprint: New -> Blueprint -> pick this repo. Secrets marked sync:false are asked for on first deploy.
services:
  - type: web
    name: agentbudget-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: prod
      - key: RAIL
        value: paykit
      - key: NETWORK
        value: localnet
      - key: RPC_URL
        value: https://402.surfnet.dev:8899
      - key: PUBLIC_DEMO
        value: "true"
      - key: VENDOR_BASE            # the vendors service's public URL, e.g. https://agentbudget-vendors.onrender.com
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALLOWED_ORIGIN_REGEX
        sync: false
      - key: OPERATOR_TOKEN
        sync: false
      - key: AGENT_KEYS
        sync: false
      - key: AGENT_WALLET_KEYS
        sync: false

  - type: web
    name: agentbudget-vendors
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn vendors.app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYWALL
        value: "on"
      - key: VENDOR_NETWORK
        value: solana_localnet
