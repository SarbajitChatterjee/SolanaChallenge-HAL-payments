<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" width="1320" height="780" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="HAL: how a purchase flows" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>HAL: how a purchase flows</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2747"/></marker></defs><rect width="1320" height="780" fill="#FBFAFF"/><text x="40" y="52" font-size="26" font-weight="700" fill="#2A2747" text-anchor="start">HAL: how a purchase flows</text><text x="40" y="80" font-size="15" font-weight="400" fill="#6B6890" text-anchor="start">The agent asks HAL. HAL checks, pays the seller in USDC on Solana, checks what comes back, and hands over clean data or a clear no.</text><rect x="30" y="170" width="190" height="170" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2.5"/><text x="125" y="205" font-size="19" font-weight="700" fill="#2A2747" text-anchor="middle">AI agent</text><text x="48" y="240" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• Asks before it buys</text><text x="48" y="262" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• Holds no key</text><text x="48" y="284" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• and no money</text><rect x="280" y="120" width="790" height="330" rx="14" fill="#FFFFFF" stroke="#A78BFA" stroke-width="3"/><text x="675" y="155" font-size="22" font-weight="700" fill="#2A2747" text-anchor="middle">HAL</text><rect x="298" y="175" width="245" height="255" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2.5"/><text x="314" y="205" font-size="16" font-weight="700" fill="#2A2747" text-anchor="start">1  Before paying</text><text x="314" y="235" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">On the approved list?</text><text x="314" y="261" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Bought already? Send the</text><text x="314" y="287" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">stored copy, pay nothing</text><text x="314" y="313" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Same thing again and again?</text><text x="314" y="339" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Stop the agent</text><text x="314" y="365" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Within budget?</text><text x="314" y="391" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Above the limit? Ask a person</text><rect x="555" y="175" width="245" height="255" rx="10" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/><text x="571" y="205" font-size="16" font-weight="700" fill="#2A2747" text-anchor="start">2  Paying</text><text x="571" y="235" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Only the agreed price</text><text x="571" y="261" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">USDC on Solana</text><text x="571" y="287" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">A public receipt</text><text x="571" y="313" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">for every payment</text><rect x="812" y="175" width="245" height="255" rx="10" fill="#FFFFFF" stroke="#F472B6" stroke-width="2.5"/><text x="828" y="205" font-size="16" font-weight="700" fill="#2A2747" text-anchor="start">3  After paying</text><text x="828" y="235" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Remove hidden instructions</text><text x="828" y="261" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">aimed at the agent</text><text x="828" y="287" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Trap link? Trace it to</text><text x="828" y="313" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">the seller that sent it</text><text x="828" y="339" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Put that seller</text><text x="828" y="365" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">under review</text><rect x="1110" y="140" width="190" height="290" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2.5"/><text x="1205" y="175" font-size="19" font-weight="700" fill="#2A2747" text-anchor="middle">Sellers</text><text x="1205" y="197" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">paid APIs, per request</text><text x="1126" y="232" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• Company record</text><text x="1126" y="258" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• Credit report</text><text x="1126" y="284" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• Exchange rate</text><text x="1126" y="310" font-size="14" font-weight="400" fill="#2A2747" text-anchor="start">• News search</text><text x="1126" y="350" font-size="13" font-weight="400" fill="#6B6890" text-anchor="start">1 to 50 cents per answer,</text><text x="1126" y="370" font-size="13" font-weight="400" fill="#6B6890" text-anchor="start">paid in USDC</text><line x1="220" y1="230" x2="278" y2="230" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="249" y="220" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">asks</text><line x1="280" y1="290" x2="222" y2="290" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="250" y="310" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">answer</text><line x1="1070" y1="240" x2="1108" y2="240" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="1089" y="230" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">pays</text><line x1="1110" y1="300" x2="1072" y2="300" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="1091" y="318" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">data</text><rect x="280" y="540" width="350" height="190" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2.5"/><text x="300" y="572" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">The person in charge</text><text x="300" y="602" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">• Sets the rules: budgets, sellers, limits</text><text x="300" y="627" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">• Approves big purchases</text><text x="300" y="652" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">• One switch stops an agent</text><text x="300" y="677" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">• Ends a seller's review</text><rect x="660" y="540" width="190" height="190" rx="10" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/><text x="680" y="572" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">Solana</text><text x="680" y="602" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">USDC payment</text><text x="680" y="627" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Public receipt</text><text x="680" y="652" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">anyone can check</text><rect x="880" y="540" width="190" height="190" rx="10" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2.5"/><text x="900" y="572" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">Ledger</text><text x="900" y="602" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Every decision,</text><text x="900" y="627" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">with its reason</text><text x="900" y="652" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">CSV for the</text><text x="900" y="677" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">accountant</text><line x1="455" y1="538" x2="455" y2="452" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="465" y="500" font-size="13" font-weight="400" fill="#6B6890" text-anchor="start">rules, approvals, kill switch</text><line x1="755" y1="452" x2="755" y2="538" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><line x1="975" y1="452" x2="975" y2="538" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="40" y="760" font-size="12.5" font-weight="400" fill="#6B6890" text-anchor="start">HAL MVP · Solana test network only · demo sellers with made-up data</text></svg>