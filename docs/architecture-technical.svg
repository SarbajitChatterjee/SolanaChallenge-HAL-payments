<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="1320" height="800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="HAL: system view" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>HAL: system view</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2A2747"/></marker></defs><rect width="1320" height="800" fill="#FBFAFF"/><text x="40" y="52" font-size="26" font-weight="700" fill="#2A2747" text-anchor="start">HAL: system view</text><text x="40" y="80" font-size="15" font-weight="400" fill="#6B6890" text-anchor="start">Three Render services (Frankfurt), one Postgres database, payments on the Solana test network.</text><rect x="40" y="130" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2.5"/><text x="60" y="162" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">Web app</text><text x="60" y="190" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">React + TypeScript, Lovable</text><text x="60" y="212" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Dashboard, tour, Be the agent</text><text x="60" y="234" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Operator token (optional)</text><rect x="40" y="290" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2.5"/><text x="60" y="322" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">AI agent</text><text x="60" y="350" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Any agent, e.g. Claude</text><text x="60" y="372" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">POST /v1/agents/{id}/call</text><text x="60" y="394" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">with its own agent key</text><rect x="360" y="120" width="560" height="420" rx="14" fill="#FFFFFF" stroke="#A78BFA" stroke-width="3"/><text x="380" y="155" font-size="19" font-weight="700" fill="#2A2747" text-anchor="start">HAL API</text><text x="470" y="155" font-size="14" font-weight="400" fill="#6B6890" text-anchor="start">FastAPI on Render (agentbudget-api)</text><rect x="380" y="168" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="190" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">policy.py</text><text x="560" y="190" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">the rules: pure decisions with reason codes</text><rect x="380" y="209" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="231" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">fingerprint.py</text><text x="560" y="231" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">what counts as "the same purchase"</text><rect x="380" y="250" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="272" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">service.py</text><text x="560" y="272" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">lock, decide, reuse or reserve, pay, settle</text><rect x="380" y="291" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="313" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">firewall.py</text><text x="560" y="313" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">checks seller data before the agent sees it</text><rect x="380" y="332" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="354" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">rails.py</text><text x="560" y="354" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">Solana Pay Kit (x402 / MPP), or a mock</text><rect x="380" y="373" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="395" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">rules.py</text><text x="560" y="395" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">rule edits, change history, demo reset</text><rect x="380" y="414" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="436" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">demo.py + tour.py</text><text x="560" y="436" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">the guided tour</text><rect x="380" y="455" width="520" height="34" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="394" y="477" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">api/</text><text x="560" y="477" font-size="13.5" font-weight="400" fill="#6B6890" text-anchor="start">public, agent and operator routes</text><rect x="990" y="120" width="290" height="250" rx="10" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/><text x="1010" y="152" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">Supabase Postgres</text><text x="1010" y="174" font-size="13" font-weight="400" fill="#6B6890" text-anchor="start">Frankfurt · schema agentbudget</text><text x="1010" y="204" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">events, event_details</text><text x="1010" y="226" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">approvals, agent_state</text><text x="1010" y="248" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">agents, catalog_items, audit_log</text><text x="1010" y="270" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">purchase_payloads (reuse)</text><text x="1010" y="292" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">content_links, seller_status,</text><text x="1010" y="314" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">seller_incidents, claims</text><text x="1010" y="336" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">early_access</text><rect x="990" y="400" width="290" height="140" rx="10" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/><text x="1010" y="432" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">Solana test network</text><text x="1010" y="460" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Localnet sandbox (or devnet)</text><text x="1010" y="482" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">USDC transfers per purchase</text><text x="1010" y="504" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Receipts in the explorer</text><rect x="360" y="610" width="560" height="150" rx="10" fill="#FFFFFF" stroke="#F472B6" stroke-width="2.5"/><text x="380" y="642" font-size="16" font-weight="700" fill="#2A2747" text-anchor="start">Demo sellers on Render (vendors/app.py, paywalled)</text><rect x="380" y="660" width="250" height="82" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="396" y="686" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">agentbudget-vendors</text><text x="396" y="710" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">Registry Data, Credit Bureau,</text><text x="396" y="729" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">FX Feed</text><rect x="650" y="660" width="250" height="82" rx="6" fill="#FFFFFF" stroke="#E4E0F7" stroke-width="1.5"/><text x="666" y="686" font-size="14" font-weight="700" fill="#2A2747" text-anchor="start">agentbudget-newswire</text><text x="666" y="710" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">News Wire (its own address,</text><text x="666" y="729" font-size="13" font-weight="400" fill="#2A2747" text-anchor="start">so it is a separate seller)</text><rect x="40" y="610" width="250" height="150" rx="10" fill="#FFFFFF" stroke="#FBBF24" stroke-width="2.5"/><text x="60" y="642" font-size="17" font-weight="700" fill="#2A2747" text-anchor="start">GitHub Actions</text><text x="60" y="670" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">Runs the tests on every push</text><text x="60" y="692" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">SQLite + mock payment rail</text><text x="60" y="714" font-size="13.5" font-weight="400" fill="#2A2747" text-anchor="start">No secrets, no Supabase</text><line x1="290" y1="190" x2="358" y2="190" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="324" y="180" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">HTTPS</text><line x1="290" y1="350" x2="358" y2="350" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="324" y="340" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">HTTPS</text><line x1="920" y1="245" x2="988" y2="245" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="954" y="235" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">SQL</text><line x1="920" y1="470" x2="988" y2="470" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="954" y="460" font-size="13" font-weight="400" fill="#6B6890" text-anchor="middle">pay</text><line x1="640" y1="540" x2="640" y2="608" stroke="#2A2747" stroke-width="2" marker-end="url(#a)"/><text x="652" y="580" font-size="13" font-weight="400" fill="#6B6890" text-anchor="start">buy with payment, get data</text><text x="40" y="790" font-size="12.5" font-weight="400" fill="#6B6890" text-anchor="start">State lives in Postgres. Budget checks lock the agent's row, so parallel requests can't overspend.</text></svg>